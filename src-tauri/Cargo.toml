[package]
name = "webutau-desktop"
version = "1.1.2"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "net", "fs"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
bytes = "1"
once_cell = "1"
futures-util = "0.3"
# OS 级密钥库——macOS Keychain / Windows Credential Manager / Linux Secret Service。
# 桌面版用户填的 LLM API key 走这里存，比加密 localStorage 安全等级高一档：
# 钥匙在 OS 进程外的安全存储，恶意网页 / 浏览器扩展碰不到
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
